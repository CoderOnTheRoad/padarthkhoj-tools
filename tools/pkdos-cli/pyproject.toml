[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkdos"
version = "0.1.0"
description = "Quantum ESPRESSO projected density of states analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sourav Ghosh"}]
license = {text = "MIT"}
keywords = ["quantum-espresso", "pdos", "materials-science", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "rich",
  "tqdm",
]

[project.scripts]
pkdos = "pkdos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
